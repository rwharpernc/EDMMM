name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify tag matches EDMMM/version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat EDMMM/version)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match EDMMM/version ($file_version)"
            exit 1
          fi

      - name: Build
        run: python scripts/build.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if [[ "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-beta* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" "dist/EDMMM-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease_flag
