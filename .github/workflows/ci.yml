name: CI

# Cheap sanity check on every push/PR: the plugin must at least import
# cleanly and the build script must be able to produce a zip. This can't
# exercise EDMC's own modules (config, theme, myNotebook aren't installable
# outside EDMC), so it's a smoke test, not a full test suite.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Byte-compile plugin sources
        run: python -m py_compile EDMMM/load.py EDMMM/edmmm/*.py

      - name: Build dist artifacts
        run: python scripts/build.py
